[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "orbis-scientia"
version = "0.1.0"
description = "Scientific Solar System simulation and reference ephemeris service"
requires-python = ">=3.12"
dependencies = [
  "astropy>=7.0,<8",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "numpy>=2.0,<3",
  "pydantic>=2.9,<3",
  "scipy>=1.14,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27"]
# The bundled DE442s reader keeps reference mode available on hosts where
# SpiceyPy has no compatible wheel.  SpiceyPy remains the preferred full-SPICE
# provider when native support is available.
spice = ["spiceypy>=6.0,<8"]

[project.scripts]
orbis = "astro_system.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
astro_system = ["iers-policy.json"]
